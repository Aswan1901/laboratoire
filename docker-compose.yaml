services:
  php:
    container_name: php
    build: ./Dockerfile/php
    volumes:
      - ./laboratoire:/var/www
    depends_on:
      - database
    networks:
      - app_network

  nginx:
    container_name: nginx
    build: Dockerfile/nginx
    ports:
      - "8000:80"
    volumes:
      - ./laboratoire:/var/www
    depends_on:
      - php
    networks:
      - app_network

volumes:
  database_data:

networks:
  app_network:
    driver: bridge